<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#230536">
  <title>FortuneGo — Jogo</title>
  <link rel="stylesheet" href="css/fortune.css">
  <link rel="stylesheet" href="css/fortune-game.css">
</head>
<body class="gm-body">

  <!-- ============================ JACKPOT ============================ -->
  <header class="fr-jackpot">
    <div class="fr-jp-top">
      <span class="fr-jp-id" id="gMeta">volatilidade alta</span>
      <div class="fr-jp-title">★★★ <b>FG JACKPOT</b> <span class="q">?</span></div>
      <span class="fr-jp-id" id="rtpLabel">RTP</span>
    </div>

    <div class="fr-grand">
      <span>GRAND</span>
      <i class="coin"></i>
      <b id="jpGrand">0,00</b>
    </div>

    <div class="fr-tiers">
      <div class="fr-tier major"><span>MAJOR</span><i class="coin"></i><b id="jpMajor">0,00</b></div>
      <div class="fr-tier minor"><span>MINOR</span><i class="coin"></i><b id="jpMinor">0,00</b></div>
      <div class="fr-tier mini"><span>MINI</span><i class="coin"></i><b id="jpMini">0,00</b></div>
    </div>
  </header>

  <!-- ============================= TAREFA ============================= -->
  <div class="fr-task">
    <button class="fr-back" id="backBtn" aria-label="Voltar ao lobby">←</button>
    <span class="fr-task-label" id="gName">Jogo</span>
    <div class="fr-task-bar">
      <i id="taskFill" style="width:0%"></i>
      <span id="taskText">Valor total ganho (0/10)</span>
    </div>
    <button class="fr-icon" id="payBtn" aria-label="Tabela de prêmios">☰</button>
  </div>

  <!-- ============================== PALCO ============================== -->
  <main class="fr-stage">
    <div class="fr-backdrop"></div>
    <img class="fr-mascot fg-no-enhance" id="gMascot" src="" alt="">

    <div class="fr-free" id="freeBanner">🎁 GIROS GRÁTIS <b id="fsLeft">0</b> · <span id="fsMult">2×</span></div>
    <div class="fr-wintext" id="winbar">Boa sorte!</div>

    <div class="fr-machine">
      <div class="fr-side" id="linesLeft"></div>

      <div class="fr-frame" id="frame">
        <div class="gm-reels" id="reels"></div>
        <svg class="gm-lines" id="lines" viewBox="0 0 300 300" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>

      <div class="fr-side" id="linesRight"></div>
    </div>
  </main>

  <!-- ============================ LETREIRO ============================ -->
  <div class="fr-marquee"><span id="marqueeText">FortuneGo recompensa você com giros grátis</span></div>

  <!-- ========================= BARRA INFERIOR ========================= -->
  <div class="fr-bottom">
    <div class="fr-cell">
      <i class="coin"></i>
      <b id="gBalance">0,00</b>
      <button class="fr-plus" id="depositBtn" aria-label="Depositar">+</button>
    </div>

    <div class="fr-cell">
      <span class="fr-win-ic">🏆</span>
      <div class="fr-win-val">
        <b id="winValue">0,00</b>
        <small id="betPerLine">0,00 / linha</small>
      </div>
    </div>

    <button class="fr-more" id="moreBtn">☰ Mais</button>
  </div>

  <!-- ============================ CONTROLES ============================ -->
  <div class="fr-controls">
    <div class="fr-ctl-left">
      <div class="fr-mult">
        <button id="betDown" aria-label="Diminuir aposta">−</button>
        <b id="multVal">1x</b>
        <button id="betUp" aria-label="Aumentar aposta">+</button>
      </div>
      <div class="fr-betval" id="betVal">0,00</div>
      <button class="fr-lines" id="linesBtn">⚙ 5 Linhas</button>
    </div>

    <button class="fr-spin" id="spinBtn" aria-label="Girar">
      <img id="spinIcon" class="fg-no-enhance" src="" alt="">
      <span class="fr-spin-label" id="spinLabel">GIRAR</span>
    </button>

    <div class="fr-ctl-right">
      <button class="fr-pill" id="turboBtn">⚡ Rápido</button>
      <button class="fr-pill" id="autoBtn">▶ Auto</button>
    </div>
  </div>

  <!-- menu "Mais" -->
  <div class="fr-popover" id="moreBox">
    <button data-more="lobby">🏠 Voltar ao lobby</button>
    <button data-more="sound">🔊 Som</button>
    <button data-more="pay">📋 Tabela de prêmios</button>
    <button data-more="diag">🩺 Diagnóstico de imagens</button>
  </div>

  <!-- menu do giro automático -->
  <div class="fr-popover" id="autoBox">
    <button data-auto="10">10 giros</button>
    <button data-auto="25">25 giros</button>
    <button data-auto="50">50 giros</button>
    <button data-auto="-1">∞ até parar</button>
  </div>

  <!-- tabela de prêmios -->
  <div class="gm-sheet" id="paysheet">
    <div class="gm-sheet-card">
      <h3 id="ptTitle">Tabela de prêmios</h3>
      <p class="sub" id="ptSub"></p>
      <div class="gm-pay" id="ptGrid"></div>
      <div class="gm-rule" id="ptRules"></div>
      <button class="gm-close" id="ptClose">Entendi</button>
    </div>
  </div>

  <!-- celebração -->
  <div class="gm-bigwin" id="bigwin">
    <div class="kind" id="bwKind">GRANDE VITÓRIA</div>
    <div class="amount" id="bwAmount">R$ 0,00</div>
    <div class="mult" id="bwMult"></div>
    <div class="tap">toque para continuar</div>
  </div>

  <script src="js/fortune-enhance.js"></script>
  <script src="js/fortune-games.js"></script>
  <script src="js/fortune-slot.js"></script>
  <script src="js/fortune-game.js"></script>
</body>
</html>
