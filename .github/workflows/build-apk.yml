name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap copy android || true
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/
      - name: Build APK debug
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "gradle exit $?"
      - name: Debug failure
        if: failure()
        run: |
          echo "::error::GRADLE_FAILED"
          tail -n 150 /tmp/gradle.log | tr '\n' ' ' | cut -c1-1000 | xargs -I{} echo "::notice::GRADLE_TAIL:{}"
          cat /tmp/gradle.log | tail -n 200 > /tmp/tail.txt
          # split into chunks for annotation (max 1024 chars)
          head -n 100 /tmp/tail.txt | tr '\n' '|' | cut -c1-900 > /tmp/c1.txt
          echo "::notice::GRADLE1:$(cat /tmp/c1.txt)"
          tail -n 100 /tmp/tail.txt | head -n 80 | tr '\n' '|' | cut -c1-900 > /tmp/c2.txt
          echo "::notice::GRADLE2:$(cat /tmp/c2.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
