name: Build FortuneGo APK

on:
  push:
    branches: [ "arena/6c53608a-fortunego" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6c53608a-fortunego
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK Debug
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: gradle.log
          retention-days: 7

      - name: Debug — exibe erro do gradle no summary
        if: failure()
        shell: bash
        run: |
          {
            echo "=== TAIL gradle.log ==="
            tail -n 150 gradle.log 2>/dev/null || echo "sem gradle.log"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug — commit gradle.log na branch ci-debug-logs
        if: failure()
        shell: bash
        run: |
          if [ -f gradle.log ]; then
            git config user.name "ci-debug"
            git config user.email "ci-debug@users.noreply.github.com"
            cp gradle.log gradle-ci-debug.log
            git add gradle-ci-debug.log
            git commit -m "ci-debug: gradle.log falha build APK" || true
            git push origin HEAD:refs/heads/ci-debug-logs
          fi

      - name: Debug — imprime erro do gradle no console
        if: failure()
        shell: bash
        run: |
          echo "=== GRADLE ERROR ==="
          tail -n 150 gradle.log 2>/dev/null || echo "sem gradle.log"
          echo "=== END ==="
