name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Debug Capacitor
        run: |
          set +e
          echo "=== capacitor configs ==="
          ls -la capacitor.config.* || echo "no config"
          cat capacitor.config.json || echo "no json"
          echo "=== dist ==="
          ls -lh dist/ || echo "no dist"
          echo "=== android ==="
          ls -la android/ | head -n 20 || echo "no android"
          npx cap --version || true
          npx cap doctor || true
          echo "debug done"
      - name: Sync Capacitor
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee /tmp/cap-sync.log
          cat /tmp/cap-sync.log
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
