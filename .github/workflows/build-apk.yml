name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap copy android || true
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/ 2>&1 | head
          ls -lh android/app/src/main/assets/public/ | head
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle.log
      - name: Show gradle log on failure
        if: failure()
        run: |
          echo "===== GRADLE LOG TAIL ====="
          tail -n 200 /tmp/gradle.log || cat /tmp/gradle.log || echo "no log"
          echo "::error::Gradle failed — see tail above"
          ls -la android/app/build/outputs/ 2>&1 | head
          ls -la /tmp/ 2>&1 | head
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
