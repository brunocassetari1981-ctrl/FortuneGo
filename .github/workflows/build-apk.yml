name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap copy android
          npx cap update android || true
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/
      - name: Build APK debug
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
      - name: Debug build failure
        if: failure()
        run: |
          grep -n "What went\|FAILURE\|Could not" /tmp/gradle.log | head -n 20 > /tmp/grep.txt
          cat /tmp/grep.txt
          cat /tmp/grep.txt | tr '\n' '|' | cut -c1-1000 > /tmp/g.txt
          echo "::error::GREP:$(cat /tmp/g.txt)"
          awk '/FAILURE: Build failed/{p=1} p' /tmp/gradle.log | head -n 40 | tr '\n' '|' | cut -c1-1000 > /tmp/a.txt
          echo "::notice::AROUND:$(cat /tmp/a.txt)"
          ls -lh android/capacitor-cordova-android-plugins/ 2>&1 | head
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
