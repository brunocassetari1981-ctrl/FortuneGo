name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap copy android || true
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "=== outputs inside android ==="
          ls -R app/build/outputs 2>&1 | head -n 50
          find app/build -type f 2>&1 | head -n 50
      - name: Debug outputs
        run: |
          echo "=== workspace root find ==="
          find . -maxdepth 4 -name "*.apk" 2>&1 | tee /tmp/apks.txt
          cat /tmp/apks.txt
          ls -R android/app/build 2>&1 | head -n 100 | tee /tmp/ls.txt
          # annotate so we can read via API without fetching logs
          echo "::notice::APK_LIST:$(cat /tmp/apks.txt | tr '\n' ';')"
          echo "::notice::LS_OUTPUT:$(cat /tmp/ls.txt | head -n 20 | tr '\n' ';')"
          echo "::notice::GRADLE_TAIL:$(tail -n 20 /tmp/gradle.log | tr '\n' ';')"
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/**/*.apk
            **/*.apk
          if-no-files-found: warn
