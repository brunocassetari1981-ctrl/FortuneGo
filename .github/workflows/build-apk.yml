name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a102ed-fortunego
    paths-ignore:
      - '**.md'
      - '_recebido/**'

permissions:
  contents: write
  issues: write

jobs:
  apk:
    name: Compilar FortuneGo (release assinado)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner do GitHub já vem com o Android SDK instalado — usamos o que
      # existe, sem depender de action de terceiros (a setup-android falhou).
      - name: Preparar Android SDK
        run: |
          set -x
          echo "ANDROID_HOME=${ANDROID_HOME:-vazio}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-vazio}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          ls -1 "$SDK" || true
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: ${SDKMANAGER:-NAO ENCONTRADO}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi
          echo "--- plataformas disponiveis ---"
          ls -1 "$SDK/platforms" 2>/dev/null || echo "nenhuma"
          echo "--- build-tools ---"
          ls -1 "$SDK/build-tools" 2>/dev/null || echo "nenhum"

      - name: Conferir a chave de assinatura
        run: |
          set -e
          echo "--- keystore/fortunego.p12 ---"
          keytool -list -v \
            -keystore keystore/fortunego.p12 \
            -storetype PKCS12 \
            -storepass fortunego \
            | grep -E 'Alias name|Entry type|Owner|Valid from|Signature algorithm|Subject Public Key'
          echo "chave OK"

      - name: Gerar inventário de imagens
        run: python3 tools/gen-asset-manifest.py

      - name: Testar motor de resgate de imagens
        run: node tools/test-matcher.js

      - name: Testar matemática dos jogos (RTP calibrado)
        run: node tools/test-slot.js

      - name: Testar animação dos rolos (60 fps simulados)
        run: node tools/test-spin.js

      - name: Smoke test da sala de jogo (DOM simulado)
        run: node tools/test-ui-smoke.js

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Release (não debug): assinado com chave estável, debuggable=false.
      # É isso que tira o aviso de "app nocivo" do Play Protect no sideload.
      - name: Compilar APK de release
        id: build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Preparar artefato
        id: apk
        run: |
          set -e
          SRC=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then echo "nenhum APK de release gerado"; exit 1; fi
          case "$SRC" in
            *unsigned*) echo "ERRO: saiu um APK NÃO ASSINADO ($SRC)"; exit 1 ;;
          esac
          cp "$SRC" FortuneGo.apk
          echo "size=$(du -h FortuneGo.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh FortuneGo.apk

      - name: Verificar a assinatura do APK
        id: verify
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs FortuneGo.apk | tee assinatura.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" assinatura.txt
          echo "assinatura v2 confirmada"
          # debuggable TEM de estar desligado: com ele o Play Protect alerta
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          if "$AAPT" dump badging FortuneGo.apk 2>/dev/null | grep -q "application-debuggable"; then
            echo "ERRO: APK está debuggable"; exit 1
          fi
          echo "debuggable: não"
          "$AAPT" dump badging FortuneGo.apk 2>/dev/null | grep -E "^package|sdkVersion|targetSdkVersion|uses-permission" || true

      - name: Relatório do lint
        if: always()
        run: |
          REP=$(find app/build/reports -name 'lint-results-release.txt' 2>/dev/null | head -1)
          if [ -n "$REP" ]; then
            {
              echo "### Lint (release)"
              echo '```'
              head -120 "$REP"
              echo '```'
            } > lint-report.md
            cat lint-report.md
          else
            echo "sem relatório de lint"
          fi

      - name: Conferir o que entrou no APK
        run: |
          {
            echo "### Conteúdo do APK"
            echo '```'
            echo "tamanho: $(du -h FortuneGo.apk | cut -f1)"
            echo "imagens empacotadas: $(unzip -l FortuneGo.apk | grep -cE 'assets/img/.*\.(png|webp)')"
            echo "---"
            unzip -l FortuneGo.apk | grep -E 'assets/([^/]*\.html|js/|css/|img/manifest)' || true
            echo '```'
            echo "### Assinatura"
            echo '```'
            grep -E "Verified using|Signer #1 certificate (DN|SHA-256)" assinatura.txt || true
            echo '```'
          } > apk-report.md
          cat apk-report.md

          # Portão: sem qualquer um destes o app abre quebrado no celular.
          for f in assets/index.html assets/game.html \
                   assets/js/fortune-enhance.js assets/js/fortune-games.js \
                   assets/js/fortune-slot.js assets/js/fortune-game.js \
                   assets/js/fortune-lobby.js \
                   assets/css/fortune.css assets/css/fortune-game.css; do
            if unzip -l FortuneGo.apk | grep -qE "[[:space:]]$f\$"; then
              echo "ok   $f"
            else
              echo "FALTA $f no APK"; exit 1
            fi
          done

      - name: Subir APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-APK
          path: FortuneGo.apk
          retention-days: 30

      - name: Publicar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CERT=$(grep -m1 "Signer #1 certificate SHA-256 digest" assinatura.txt | cut -d: -f2- | tr -d ' ')
          gh release delete apk --yes --cleanup-tag 2>/dev/null || true
          gh release delete apk-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create apk FortuneGo.apk \
            --target "${{ github.sha }}" \
            --title "FortuneGo — APK assinado" \
            --notes "APK de **release assinado**, gerado do commit \`${{ github.sha }}\` (${{ steps.apk.outputs.size }}).

          **Como instalar**
          1. Baixe o \`FortuneGo.apk\` no celular.
          2. Se você já tinha a versão antiga (de debug), **desinstale antes** — a assinatura mudou e o Android não deixa atualizar por cima.
          3. Abra o arquivo e autorize *Instalar apps de fontes desconhecidas* quando o Android pedir. Esse pedido é padrão de qualquer app fora da Play Store.

          **Por que não aparece mais aviso de risco:** o APK é assinado com chave de release estável (v1+v2+v3), não é depurável e pede só 3 permissões (internet, estado da rede e vibração).

          Impressão digital SHA-256 do certificado: \`$CERT\`"

      # Devolve o resultado por uma issue, porque o download de log do Actions
      # não é acessível de onde o agente roda.
      - name: Relatório do build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ job.status }}"
          {
            echo "## Build \`${{ github.sha }}\` — resultado: **$STATUS**"
            echo
            [ -f apk-report.md ] && cat apk-report.md
            [ -f lint-report.md ] && cat lint-report.md
            echo
            echo '```'
            if [ -f build.log ]; then
              grep -E "[Ee]rror:|e: |FAILURE|What went wrong|Caused by|> Task .*FAILED|Execution failed|Unresolved reference|Lint found|warning:" build.log \
                | head -80 || true
              echo "..."
              tail -60 build.log
            else
              echo "build.log não foi gerado — a falha ocorreu antes da compilação."
            fi
            echo '```'
          } > relatorio.md

          head -c 60000 relatorio.md > relatorio-curto.md
          cat relatorio-curto.md >> "$GITHUB_STEP_SUMMARY"

          EXISTING=$(gh issue list --state open --search "Relatório de build in:title" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file relatorio-curto.md
          else
            gh issue create --title "Relatório de build (CI)" --body-file relatorio-curto.md
          fi
