name: Build FortuneGo APK

on:
  push:
    branches: [ "arena/6c53608a-fortunego" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6c53608a-fortunego
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK Debug
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle.log
          echo "GRADLE_EXIT:${PIPESTATUS[0]}" | tee -a ../gradle.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Save gradle log on failure
        if: failure()
        run: |
          echo "=== GRADLE LOG TAIL ==="
          tail -n 800 ../gradle.log 2>&1 | head -n 800
          cp ../gradle.log ./gradle.log 2>&1 || cp android/../gradle.log ./gradle.log || true
          ls -lh gradle.log
          # also try android build log
          cat android/app/build/outputs/logs/*.log 2>&1 | head -n 200 || true
          git config user.email "ci@fortunego.local"
          git config user.name "FortuneGo CI"
          git add gradle.log || true
          git commit -m "ci: gradle log falha" || echo "nothing"
          git push origin HEAD:arena/6c53608a-fortunego || echo "push failed"
          cat gradle.log | tail -n 200
