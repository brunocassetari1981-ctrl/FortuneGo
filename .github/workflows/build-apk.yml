name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor (copy only)
        run: |
          set +e
          echo "=== trying cap copy ==="
          npx cap copy android 2>&1 | tee /tmp/cap.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "cap copy failed, trying manual copy"
            mkdir -p android/app/src/main/assets/public
            cp -R dist/* android/app/src/main/assets/public/ || true
            cp capacitor.config.json android/app/src/main/assets/ || true
            ls -lh android/app/src/main/assets/public/ | head
          fi
          cat /tmp/cap.log || true
          ls -lh android/app/src/main/assets/public/ | head -n 5
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
