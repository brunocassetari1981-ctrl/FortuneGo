name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor
        run: |
          set +e
          npx cap copy android 2>&1 | tee /tmp/cap.log
          echo "--- cap copy done, manual fallback ---"
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/ || true
          ls -lh android/app/src/main/assets/public/ | head
      - name: Install Android SDK
        run: |
          sdkmanager --version || echo "no sdkmanager"
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          sdkmanager --list_installed | head -n 30 || true
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle.log
          exit ${PIPESTATUS[0]}
      - name: Upload gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle.log
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
