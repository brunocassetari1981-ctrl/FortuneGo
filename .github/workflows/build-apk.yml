name: Build FortuneGo APK

on:
  push:
    branches: [ arena/fd516333-fortunego ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: npm ci
      - name: Build web
        run: npm run build
      - name: Sync Capacitor
        run: |
          npx cap copy android || true
          mkdir -p android/app/src/main/assets/public
          cp -R dist/* android/app/src/main/assets/public/
          ls -lh android/app/src/main/assets/public/ | head
      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log
          echo "=== BUILD DONE ==="
          ls -lh app/build/outputs/apk/debug/ 2>&1 | head -n 20
          find app/build -type f 2>&1 | head -n 50
      - name: Debug outputs
        run: |
          pwd
          ls -R android/app/build/outputs 2>&1 | head -n 200
          echo "--- find apk ---"
          find . -name "*.apk" -type f 2>&1 | head -n 20
          ls -lh android/app/build/outputs/apk/debug/ 2>&1 || echo "no debug dir"
          cat /tmp/gradle.log | tail -n 100 || echo "no log"
      - uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
