name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a102ed-fortunego
    paths-ignore:
      - '**.md'
      - '_recebido/**'

permissions:
  contents: write

jobs:
  apk:
    name: Compilar FortuneGo (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Gerar inventário de imagens
        run: python3 tools/gen-asset-manifest.py

      - name: Testar motor de resgate de imagens
        run: node tools/test-matcher.js

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK de debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar artefato
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$SRC" FortuneGo-debug.apk
          echo "size=$(du -h FortuneGo-debug.apk | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -lh FortuneGo-debug.apk

      - name: Subir APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-APK
          path: FortuneGo-debug.apk
          retention-days: 30

      - name: Publicar release com o APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-debug FortuneGo-debug.apk \
            --target "${{ github.sha }}" \
            --title "FortuneGo — APK de debug" \
            --prerelease \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}.

          Tamanho: ${{ steps.apk.outputs.size }}

          **Como instalar:** baixe o arquivo no celular, abra e autorize
          *Instalar apps de fontes desconhecidas* se o Android pedir.
          Build de debug — não serve para publicar na Play Store."
