name: Build FortuneGo APK

on:
  push:
    branches: [ "arena/6c53608a-fortunego" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: arena/6c53608a-fortunego
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee cap-sync.log

      - name: Build APK Debug
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-logs
          path: |
            cap-sync.log
            gradle.log
          retention-days: 7

      - name: Debug — exibe erro do gradle
        if: failure()
        shell: bash
        run: |
          {
            echo "=== TAIL gradle.log ==="
            tail -n 120 gradle.log 2>/dev/null || echo "sem gradle.log"
            echo "=== TAIL cap-sync.log ==="
            tail -n 60 cap-sync.log 2>/dev/null || echo "sem cap-sync.log"
          } >> "$GITHUB_STEP_SUMMARY"
