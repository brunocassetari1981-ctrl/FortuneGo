name: Build FortuneGo APK

on:
  push:
    branches: [ "arena/6c53608a-fortunego" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/6c53608a-fortunego
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.1.8937393'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK Debug
        working-directory: android
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee ../gradle.log
          echo "EXIT_CODE:${PIPESTATUS[0]}" | tee -a ../gradle.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FortuneGo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Save Gradle log to branch on failure
        if: failure()
        run: |
          echo "=== GRADLE LOG (last 500 lines) ==="
          tail -n 500 ../gradle.log || cat ../gradle.log || echo "no log"
          cp ../gradle.log ./gradle-failure.log || cp gradle.log ./gradle-failure.log || true
          git config user.email "ci@fortunego.local"
          git config user.name "FortuneGo CI"
          git add gradle-failure.log || true
          git commit -m "ci: gradle failure log" || echo "nothing to commit"
          git push origin HEAD:arena/6c53608a-fortunego || echo "push failed"
